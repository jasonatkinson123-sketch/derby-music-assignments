<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8f7f3"><title>Piano Songs · Derby Music</title><style>
*{box-sizing:border-box}body{margin:0;background:#f8f7f3;color:#263447;font-family:system-ui,Arial,sans-serif}main{max-width:1160px;margin:auto;padding:12px 18px 35px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}header h1{font-size:clamp(23px,3.5vw,34px);margin:8px 0;font-weight:750}a{color:#263447;text-decoration:none}.songs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:10px 0 18px}.song{background:white;border:2px solid #dddcd8;border-radius:15px;padding:10px 5px;min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:#263447}.song[aria-pressed=true]{border:4px solid #3877a3;background:#e8f4fa}.picture{font-size:clamp(32px,5vw,54px);line-height:1.2}.songname{font-size:clamp(11px,1.4vw,15px);font-weight:700;text-align:center}.board{background:#fff;border:2px solid #deddd8;border-radius:20px;padding:18px 16px 22px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.mode{display:flex;gap:7px;flex-wrap:wrap}.control{border:2px solid #d2d9dc;border-radius:12px;background:white;color:#263447;font:inherit;font-weight:700;padding:10px 15px;cursor:pointer;min-height:45px}.control[aria-pressed=true]{background:#d9ecf5;border-color:#4787ac}.note-strip{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;min-height:62px;margin:18px 0 12px}.note{height:45px;min-width:39px;display:grid;place-items:center;border-radius:10px;background:#edf0f2;font-weight:750;font-size:20px}.note.done{background:#d7e9dc;color:#35714c}.note.next{background:#f6d779;color:#222;outline:3px solid #f1c650}.piano{position:relative;width:min(100%,1050px);height:clamp(205px,29vw,320px);margin:12px auto 18px;display:flex;isolation:isolate}.white{width:calc(100% / 7);height:100%;background:linear-gradient(#fff,#f5f5f4);border:2px solid #454a50;border-bottom:10px solid #b9bec3;border-radius:0 0 12px 12px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:18px;color:#333;font-size:clamp(21px,3vw,32px);font-weight:800;cursor:pointer;touch-action:manipulation}.white{position:relative;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.key-note{pointer-events:none}.key-shortcut{position:absolute;left:9px;bottom:8px;font-size:12px;font-weight:600;color:#89929b;pointer-events:none}.white:first-child{border-radius:9px 0 12px 12px}.white:nth-child(7){border-radius:0 9px 12px 12px}.white.lit{background:#f7dc83}.white.pressed{background:#b9e1f2}.black{position:absolute;top:0;width:9%;height:59%;z-index:2;border:2px solid #151a20;border-bottom:8px solid #0e1218;border-radius:0 0 8px 8px;background:linear-gradient(90deg,#242b34,#10151d 65%,#3d4652);cursor:pointer;touch-action:manipulation}.black{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.black.pressed{background:#477f9f}.black.lit{background:#a77ed4}.bottom{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.big{font-size:21px;min-width:65px;min-height:55px}.status{text-align:center;min-height:34px;font-size:25px;font-weight:800;color:#35714c}.small{font-size:13px;color:#6d747b;text-align:center;margin-top:10px}.celebration{position:fixed;inset:0;z-index:30;pointer-events:none;overflow:hidden}.confetti{position:absolute;top:-24px;width:10px;height:15px;border-radius:2px;opacity:0;animation:confetti-fall 2.6s ease-in forwards}@keyframes confetti-fall{0%{transform:translate3d(0,-30px,0) rotate(0);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translate3d(var(--drift),105vh,0) rotate(var(--spin));opacity:0}}@media(prefers-reduced-motion:reduce){.confetti{animation:none;display:none}}.hide{display:none!important}button:focus-visible,a:focus-visible{outline:4px solid #3d8bb8;outline-offset:3px}@media(max-width:700px){.songs{grid-template-columns:repeat(3,1fr)}.song{min-height:92px}.board{padding:12px 7px}.white{padding-bottom:20px}.key-shortcut{left:5px;bottom:5px;font-size:10px}.note{min-width:29px;height:35px;font-size:16px}.top{justify-content:center}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><main><header><h1>🎹 Piano Songs</h1><a href="./" aria-label="Back to music assignments">← Back</a></header><nav class="songs" id="songs" aria-label="Choose a song"></nav><section class="board" aria-label="Play the piano"><div class="top"><div class="mode" id="modes"><button class="control" data-mode="follow" aria-pressed="true">👆 Learn</button><button class="control" data-mode="read" aria-pressed="false">🎵 Play</button><button class="control" data-mode="free" aria-pressed="false">🎹 Explore</button></div><div class="mode"><button class="control" id="hear" aria-label="Hear song">🔊</button><button class="control" id="restart" aria-label="Start again">↻</button><button class="control" id="labels" aria-pressed="true" aria-label="Toggle note letters">ABC</button></div></div><div id="notes" class="note-strip" aria-label="Notes to play"></div><div id="piano" class="piano" aria-label="Piano keyboard"></div><div class="status" id="status" role="status" aria-live="polite"></div><div class="celebration" id="celebration" aria-hidden="true"></div><div class="small">Computer keys: A S D F G H J</div></section></main><script>
const songs=[{id:'hot',name:'Hot Cross Buns',icon:'🍞',notes:'E D C | E D C | C C C C D D D D | E D C'},{id:'mary',name:'Mary Had a Little Lamb',icon:'🐑',notes:'E D C D | E E E | D D D | E G G | E D C D | E E E E | D D E D C'},{id:'twinkle',name:'Twinkle Twinkle',icon:'⭐',notes:'C C G G A A G | F F E E D D C | G G F F E E D | G G F F E E D | C C G G A A G | F F E E D D C'},{id:'row',name:'Row Your Boat',icon:'🚣',notes:'C C C D E | E D E F G | C C C G G G | E E E C C C | G F E D C'},{id:'london',name:'London Bridge',icon:'🌉',notes:'G A G F E F G | D E F | E F G | G A G F E F G | D G E C'},{id:'jacques',name:'Frère Jacques',icon:'🔔',notes:'C D E C | C D E C | E F G | E F G | G A G F E C | G A G F E C | C G C | C G C'}];
const white=['C','D','E','F','G','A','B'],keyLetters=['A','S','D','F','G','H','J'],frequencies={C:261.63,'C#':277.18,D:293.66,'D#':311.13,E:329.63,F:349.23,'F#':369.99,G:392,'G#':415.30,A:440,'A#':466.16,B:493.88},black=[['C#',1],['D#',2],['F#',4],['G#',5],['A#',6]];let song=songs[0],idx=0,mode='follow',labels=true,ctx=null,token=0;const $=id=>document.getElementById(id);
function sequence(){return song.notes.split(/\s+/).filter(n=>white.includes(n))}
function sound(n,delay=0){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=ctx||new AC();if(ctx.state==='suspended')ctx.resume();let t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=frequencies[n];g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.45);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.47)}
function reset(){token++;$('celebration').replaceChildren();idx=0;$('status').textContent='';render()}
function celebrate(){const layer=$('celebration');layer.replaceChildren();if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;const colors=['#f4c94e','#6ebcdb','#8dcf99','#dba4cf','#f59a72'];for(let i=0;i<45;i++){const bit=document.createElement('span');bit.className='confetti';bit.style.left=(5+Math.random()*90)+'%';bit.style.background=colors[i%colors.length];bit.style.animationDelay=(Math.random()*.55)+'s';bit.style.setProperty('--drift',(Math.random()*240-120)+'px');bit.style.setProperty('--spin',(Math.random()*900-450)+'deg');layer.append(bit)}setTimeout(()=>layer.replaceChildren(),3400)}function play(n,button){sound(n);if(button){button.classList.add('pressed');setTimeout(()=>button.classList.remove('pressed'),160)}if(mode==='free')return;const m=sequence();if(idx>=m.length)return;if(n===m[idx]){idx++;if(idx===m.length){$('status').textContent='✓ ⭐';celebrate()}render()}else{$('status').textContent='';}}
function render(){const m=sequence();$('songs').replaceChildren();songs.forEach(s=>{let b=document.createElement('button');b.className='song';b.setAttribute('aria-pressed',String(s.id===song.id));b.setAttribute('aria-label',s.name);let pic=document.createElement('span');pic.className='picture';pic.textContent=s.icon;let label=document.createElement('span');label.className='songname';label.textContent=s.name;b.append(pic,label);b.onclick=()=>{song=s;reset()};$('songs').append(b)});
$('notes').replaceChildren();if(mode!=='free'){const start=Math.max(0,Math.min(idx-2,m.length-9)),end=Math.min(m.length,start+9);for(let i=start;i<end;i++){let n=document.createElement('span');n.className='note'+(i<idx?' done':'')+(i===idx?' next':'');n.textContent=labels?m[i]:'♪';$('notes').append(n)}}const piano=$('piano');piano.replaceChildren();white.forEach((n,i)=>{let b=document.createElement('button');b.className='white'+(mode==='follow'&&m[idx]===n?' lit':'');b.setAttribute('aria-label',n+' piano key');let note=document.createElement('span');note.className='key-note';note.textContent=labels?n:'';let shortcut=document.createElement('span');shortcut.className='key-shortcut';shortcut.textContent=keyLetters[i];shortcut.setAttribute('aria-hidden','true');b.append(note,shortcut);b.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();play(n,b)};b.onclick=e=>{if(e.detail===0)play(n,b)};piano.append(b)});black.forEach(([n,after])=>{let b=document.createElement('button');b.className='black';b.style.left='calc('+(after*100/7)+'% - 4.5%)';b.setAttribute('aria-label',n+' black piano key');b.onpointerdown=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();e.stopPropagation();play(n,b)};b.onclick=e=>{if(e.detail===0)play(n,b)};piano.append(b)});document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));$('labels').setAttribute('aria-pressed',String(labels))}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;reset()});$('restart').onclick=reset;$('labels').onclick=()=>{labels=!labels;render()};$('hear').onclick=()=>{token++;const current=token;sequence().forEach((n,i)=>setTimeout(()=>{if(token===current)sound(n)},i*470))};document.addEventListener('keydown',e=>{if(e.repeat||e.altKey||e.ctrlKey||e.metaKey)return;if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;let i=keyLetters.indexOf(e.key.toUpperCase());if(i>=0){e.preventDefault();play(white[i])}});reset();
</script></body></html>
