<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What Is an Instrument? · Instrument Lab</title><style>:root{--ink:#183451;--blue:#3272bd;--cream:#fff9ec}*{box-sizing:border-box}body{margin:0;background:#e8f2fa;color:var(--ink);font:20px/1.4 system-ui,Arial,sans-serif}main{max-width:1060px;margin:auto;padding:20px}header{background:#163d6c;color:white;border-radius:22px;padding:25px;margin-bottom:20px}h1{font-size:clamp(30px,5vw,53px);margin:6px 0}h2{margin:0 0 10px;font-size:30px}.eyebrow{font-size:14px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#f8d26c}.steps{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.steps button{background:white;border:3px solid #bad0e4;color:#17375d}.steps button.active{background:#163d6c;color:white}.panel{background:white;border-radius:20px;padding:25px;box-shadow:0 5px 20px #21436c18;min-height:420px}button{cursor:pointer;border:3px solid #234b73;background:#fff;border-radius:13px;padding:14px 20px;font-size:20px;font-weight:800;color:#17375d;touch-action:manipulation}button:focus-visible{outline:5px solid #f5b635;outline-offset:3px}.primary{background:#f9cf53}.muted{color:#4a657f}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.tile{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;background:#f4f9ff}.tile .icon{font-size:65px}.tile.chosen{background:#d6f4dc;border-color:#238c50}.tile.wrong{background:#ffe3df;border-color:#d05747}.bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:22px;flex-wrap:wrap}.palette{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.swatch{width:78px;height:74px;border:4px solid #17375d}.swatch.selected{outline:5px solid #f9b83d;outline-offset:3px}.art{background:var(--cream);border:3px solid #b3c9dc;border-radius:18px;padding:10px;max-width:850px;margin:auto}.art svg{display:block;width:100%;height:auto}.paintable{cursor:pointer;stroke:#1a3550;stroke-width:4;transition:fill .12s}.paintable:focus{outline:none;stroke:#ef7e31;stroke-width:8}.art text{font:bold 23px system-ui;pointer-events:none}.result{padding:14px;border-radius:12px;background:#edf6fc;margin:15px 0;font-weight:700}.hide{display:none}.challenge{background:#f6f0ff;border:3px solid #c6b0e7;padding:18px;border-radius:14px;margin-top:18px}.sortbox{display:grid;grid-template-columns:1fr 1fr;gap:15px}.sortbox>div{padding:15px;border:3px solid #b7cde1;border-radius:16px}.sortbox button{margin:6px}textarea{width:100%;min-height:100px;font:20px system-ui;border:2px solid #9bb8d4;border-radius:12px;padding:12px}@media(max-width:650px){main{padding:10px}.grid{grid-template-columns:repeat(2,1fr)}.tile{min-height:140px}.tile .icon{font-size:45px}.panel{padding:15px}.sortbox{grid-template-columns:1fr}}@media print{body{background:white}header,.steps,.bottom,.palette,.no-print{display:none!important}.panel{box-shadow:none}.art{max-width:650px}}</style></head><body><main><header><div class="eyebrow">Instrument Lab · Week 1 · Monday</div><h1>WHAT IS AN INSTRUMENT?</h1><div>Explore • Color • Sort • Create</div></header><nav class="steps" id="steps" aria-label="Assignment sections"></nav><section class="panel"><div id="stage"></div><div class="bottom"><button id="prev">← BACK</button><span id="progress" class="muted"></span><button id="next" class="primary">NEXT →</button></div></section></main><script>
const items=[['🎺','Trumpet',true],['⚽','Soccer ball',false],['🥁','Drum',true],['🪥','Toothbrush',false],['🎸','Guitar',true],['🚲','Bicycle',false],['🎹','Piano',true],['🎻','Violin',true],['📚','Books',false]];const colors=['#f2bd45','#62b5e5','#ee7c83','#8ccf8c','#ad94dc'];const keys=['trumpet','guitar','drum','piano','violin'];let page=0,selectedColor=0;let state={identified:{},paint:{},sorted:{},response:''};try{state={...state,...JSON.parse(localStorage.getItem('instrumentLabMonday')||'{}')}}catch(e){}const save=()=>{try{localStorage.setItem('instrumentLabMonday',JSON.stringify(state))}catch(e){}};const stage=document.getElementById('stage');function el(tag,txt,cls){let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}function add(tag,txt,cls,parent=stage){const n=el(tag,txt,cls);parent.append(n);return n}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=.85;speechSynthesis.speak(u)}}function render(){stage.replaceChildren();document.getElementById('steps').replaceChildren();['Explore','Color','Sort','Create'].forEach((s,i)=>{const b=el('button',(i+1)+'. '+s,i===page?'active':'');b.onclick=()=>{page=i;render()};document.getElementById('steps').append(b)});document.getElementById('progress').textContent=(page+1)+' of 4';document.getElementById('prev').disabled=page===0;document.getElementById('next').textContent=page===3?'FINISH ✓':'NEXT →';if(page===0)explore();if(page===1)color();if(page===2)sort();if(page===3)create()}function explore(){add('h2','1. What makes music?');add('p','An instrument is something we use to make musical sounds. Tap each picture. Is it a musical instrument?');const g=add('div',undefined,'grid');items.forEach(([icon,name,yes],i)=>{const b=el('button',undefined,'tile'+(state.identified[i]!==undefined?(state.identified[i]===yes?' chosen':' wrong'):''));b.innerHTML='<span class="icon">'+icon+'</span><span>'+name+'</span>';b.onclick=()=>{const response=confirm('Is '+name.toLowerCase()+' a musical instrument?\n\nOK = YES     Cancel = NO');state.identified[i]=response;save();render()};g.append(b)});add('p','Green = correct choice. Pink = try again.','muted');const info=add('div','An instrument makes sound when something vibrates. We might blow, pluck, strike, shake, or press keys.','result');const btn=add('button','🔊 HEAR THE INSTRUCTIONS','no-print');btn.onclick=()=>speak('An instrument is something we use to make musical sounds. Look at each picture. Is it an instrument?')}function color(){add('h2','2. Color the music makers');add('p','Pick a color. Then tap the numbered parts of the instruments. Any color is okay!');const pal=add('div',undefined,'palette');colors.forEach((c,i)=>{const b=el('button',String(i+1),'swatch'+(i===selectedColor?' selected':''));b.style.background=c;b.setAttribute('aria-label','Choose color '+(i+1));b.onclick=()=>{selectedColor=i;render()};pal.append(b)});const box=add('div',undefined,'art');const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 820 500');svg.setAttribute('role','img');svg.setAttribute('aria-label','Coloring page with trumpet, guitar, drum, piano, and violin');box.append(svg);const shapes=[
['trumpet','M 65 88 L 255 88 L 255 64 L 285 64 L 285 148 L 255 148 L 255 124 L 65 124 Z',115,112],
['trumpet','M 100 124 L 100 162 L 125 162 L 125 124 Z',113,144],
['trumpet','M 158 124 L 158 162 L 183 162 L 183 124 Z',170,144],
['guitar','M 492 60 C 540 15 595 70 570 120 C 630 160 595 242 530 238 C 455 240 440 174 485 134 C 455 108 460 82 492 60 Z',528,179],
['guitar','M 525 53 L 535 10 L 552 10 L 548 140 L 529 140 Z',538,70],
['drum','M 70 316 Q 150 283 250 316 L 250 410 Q 155 446 70 410 Z',160,376],
['drum','M 70 316 Q 160 285 250 316 Q 160 349 70 316 Z',160,320],
['piano','M 330 315 L 535 315 L 535 424 L 330 424 Z',432,374],
['piano','M 330 350 L 535 350 L 535 402 L 330 402 Z',430,378],
['violin','M 655 280 C 615 290 615 330 645 350 C 620 390 645 440 690 438 C 745 438 758 389 723 350 C 750 322 737 286 700 280 Z',683,377],
['violin','M 681 278 L 683 215 L 702 215 L 703 278 Z',690,251]
];shapes.forEach(([name,d,x,y],i)=>{const p=document.createElementNS(svg.namespaceURI,'path');p.setAttribute('d',d);p.setAttribute('class','paintable');p.setAttribute('fill',state.paint[i]??'#fff');p.setAttribute('tabindex','0');p.setAttribute('role','button');p.setAttribute('aria-label','Color '+name+' section '+(i+1));const fill=()=>{state.paint[i]=colors[selectedColor];save();render()};p.addEventListener('click',fill);p.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fill()}});svg.append(p);if(!state.paint[i]){const t=document.createElementNS(svg.namespaceURI,'text');t.setAttribute('x',x);t.setAttribute('y',y);t.textContent=(i%5)+1;svg.append(t)}});[['TRUMPET',175,195],['GUITAR',535,270],['DRUM',160,465],['PIANO',430,465],['VIOLIN',690,465]].forEach(([t,x,y])=>{const n=document.createElementNS(svg.namespaceURI,'text');n.setAttribute('x',x);n.setAttribute('y',y);n.setAttribute('text-anchor','middle');n.setAttribute('fill','#1a3550');n.textContent=t;svg.append(n)});add('p',Object.keys(state.paint).length+' of '+shapes.length+' sections colored.','muted');const reset=add('button','CLEAR COLORS','no-print');reset.onclick=()=>{if(confirm('Clear your coloring?')){state.paint={};save();render()}}}function sort(){add('h2','3. Instrument or not?');add('p','Tap each picture, then choose INSTRUMENT or NOT AN INSTRUMENT.');const g=add('div',undefined,'grid');items.forEach(([icon,name,yes],i)=>{const b=el('button',icon+' '+name,'tile'+(state.sorted[i]!==undefined?(state.sorted[i]===yes?' chosen':' wrong'):''));b.onclick=()=>{const menu=document.getElementById('sortmenu');menu.replaceChildren();add('p','Where does '+name+' belong?','',menu);[['🎵 INSTRUMENT',true],['✖ NOT AN INSTRUMENT',false]].forEach(([label,v])=>{const opt=el('button',label);opt.onclick=()=>{state.sorted[i]=v;save();render()};menu.append(opt)})};g.append(b)});add('div','Choose a picture above.','result').id='sortmenu';add('p','A bicycle makes noise, but it is not usually used as a musical instrument.','muted')}function create(){add('h2','4. Build your own band!');add('p','Choose three instruments you would put in a band. You can draw, type, tell your teacher, or point.');const g=add('div',undefined,'grid');[['🎺','Trumpet'],['🥁','Drum'],['🎸','Guitar'],['🎹','Piano'],['🎻','Violin'],['🪈','Flute']].forEach(([icon,name])=>{const b=el('button',icon+' '+name,'tile');b.onclick=()=>{const t=document.getElementById('response');t.value+=(t.value?', ':'')+name;state.response=t.value;save()};g.append(b)});add('p','My band will include:');const ta=add('textarea');ta.id='response';ta.value=state.response;ta.placeholder='Tap instruments above or write your choices here.';ta.oninput=()=>{state.response=ta.value;save()};const ch=add('div',undefined,'challenge');add('h3','⭐ EXTRA CHALLENGE','',ch);add('p','How would your instruments make sound? Which would play the beat? Which would play the melody?','',ch);const done=add('div','Great work! You explored, colored, sorted, and created.','result');const print=add('button','🖨 PRINT / SAVE AS PDF','no-print');print.onclick=()=>window.print()}document.getElementById('prev').onclick=()=>{if(page>0){page--;render();scrollTo(0,0)}};document.getElementById('next').onclick=()=>{if(page<3){page++;render();scrollTo(0,0)}else{alert('Great job! Your work is saved on this device. Use Print / Save as PDF to keep a copy.')}};render();
</script></body></html>
